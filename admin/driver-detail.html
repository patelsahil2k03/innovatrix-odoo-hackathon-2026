<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Driver Detail — TransitOps Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/design-system.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-mark">T</div>
      <div>
        <div class="sidebar-brand-name">TransitOps</div>
        <div class="sidebar-brand-sub">Super Admin</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-group">
        <div class="sidebar-group-label">Overview</div>
        <a href="index.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
      </div>
      <div class="sidebar-group">
        <div class="sidebar-group-label">Fleet</div>
        <a href="vehicles.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 24 24"><rect x="1" y="5" width="15" height="11"/><path d="M16 9h4l3 3v4h-7V9z"/><circle cx="5.5" cy="18" r="2"/><circle cx="18.5" cy="18" r="2"/></svg>
          Vehicles
        </a>
        <a href="drivers.html" class="sidebar-link is-active">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Drivers
        </a>
      </div>
      <div class="sidebar-group">
        <div class="sidebar-group-label">Operations</div>
        <a href="trips.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8 19h7a4 4 0 0 0 4-4v-1a4 4 0 0 0-4-4H9a4 4 0 0 1-4-4v-1"/></svg>
          Trips &amp; Dispatch
        </a>
        <a href="analytics.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>
          Fleet Map &amp; Analytics
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">GR</div>
        <div>
          <div class="sidebar-user-name">Gaurav Rathva</div>
          <div class="sidebar-user-role">Super Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap: var(--space-xs);">
        <button class="nav-toggle" data-nav-toggle aria-label="Toggle navigation">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <a href="drivers.html" class="icon-btn" aria-label="Back to drivers">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <div class="topbar-title-group">
          <div class="text-caption-uppercase topbar-eyebrow">Drivers</div>
          <h1 class="text-display-md topbar-title" id="driver-title">—</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-outline-muted btn-sm">Edit</button>
        <button class="btn btn-primary btn-sm">Assign to Trip</button>
      </div>
    </header>

    <main class="content">

      <div style="display:flex; align-items:center; gap: var(--space-xs); margin-bottom: var(--space-sm);" id="driver-meta"></div>

      <div class="spec-strip" id="spec-strip"></div>

      <div data-tabs>
        <div class="tabs">
          <a href="#" class="tab is-active" data-tab="tab-overview">Overview</a>
          <a href="#" class="tab" data-tab="tab-documents">Documents</a>
          <a href="#" class="tab" data-tab="tab-trips">Trips</a>
        </div>

        <div class="tab-panel is-active" id="tab-overview">
          <div class="grid-2col-even">
            <div class="panel">
              <div class="panel-header"><h2 class="text-title-md" style="margin:0;">Driver Information</h2></div>
              <div class="panel-body stack-sm" id="overview-info"></div>
            </div>
            <div class="panel">
              <div class="panel-header"><h2 class="text-title-md" style="margin:0;">Performance Summary</h2></div>
              <div class="panel-body stack-sm" id="overview-performance"></div>
            </div>
          </div>
        </div>

        <div class="tab-panel" id="tab-documents">
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Document Type</th><th>Expiry Date</th><th></th></tr></thead>
              <tbody id="documents-body"></tbody>
            </table>
          </div>
        </div>

        <div class="tab-panel" id="tab-trips">
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Route</th><th>Vehicle</th><th>Revenue</th><th>Status</th><th>Dispatched</th></tr></thead>
              <tbody id="trips-body"></tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="assets/mock-data.js"></script>
<script src="assets/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const driverId = params.get("id") || "d1";
  const driver = DB.getDriver(driverId) || DB.drivers[0];
  const perf = DB.driverPerformance[driver.id];

  document.title = `${driver.name} — TransitOps Super Admin`;
  document.getElementById("driver-title").textContent = driver.name;

  document.getElementById("driver-meta").innerHTML = `
    ${StatusBadge.driver(driver.status)}
    <span class="text-body-md u-body">${driver.license_category} · Lic. ${driver.license_number}</span>
  `;

  document.getElementById("spec-strip").innerHTML = `
    <div class="spec-cell"><span class="spec-value text-number-display">${perf.total_trips}</span><span class="spec-label text-caption-uppercase">Total Trips</span></div>
    <div class="spec-cell"><span class="spec-value text-number-display">${perf.avg_fuel_efficiency}</span><span class="spec-label text-caption-uppercase">Avg km/l</span></div>
    <div class="spec-cell"><span class="spec-value text-number-display ${perf.incident_count > 3 ? 'is-warning' : 'is-success'}">${perf.incident_count}</span><span class="spec-label text-caption-uppercase">Incidents</span></div>
    <div class="spec-cell"><span class="spec-value text-number-display is-primary">${perf.rating.toFixed(1)}</span><span class="spec-label text-caption-uppercase">Rating / 5</span></div>
    <div class="spec-cell"><span class="spec-value text-number-display ${healthMeterClass(driver.safety_score) === 'is-warning' ? 'is-warning' : ''}">${driver.safety_score}</span><span class="spec-label text-caption-uppercase">Safety Score</span></div>
  `;

  document.getElementById("overview-info").innerHTML = `
    <div class="health-row"><div class="health-meta text-body-sm u-muted-soft">Full Name</div><div class="cell-strong">${driver.name}</div></div>
    <div class="health-row"><div class="health-meta text-body-sm u-muted-soft">License Number</div><div class="cell-strong">${driver.license_number}</div></div>
    <div class="health-row"><div class="health-meta text-body-sm u-muted-soft">License Category</div><div class="cell-strong">${driver.license_category}</div></div>
    <div class="health-row"><div class="health-meta text-body-sm u-muted-soft">License Expiry</div><div class="cell-strong">${DB.fmtDate(driver.license_expiry_date)}</div></div>
    <div class="health-row"><div class="health-meta text-body-sm u-muted-soft">Phone</div><div class="cell-strong">${driver.phone}</div></div>
  `;

  document.getElementById("overview-performance").innerHTML = `
    <div class="health-row"><div class="health-meta text-body-sm u-muted-soft">Total Trips Completed</div><div class="cell-strong">${perf.total_trips}</div></div>
    <div class="health-row"><div class="health-meta text-body-sm u-muted-soft">Average Fuel Efficiency</div><div class="cell-strong">${perf.avg_fuel_efficiency} km/l</div></div>
    <div class="health-row"><div class="health-meta text-body-sm u-muted-soft">Incident Count</div><div class="cell-strong">${perf.incident_count}</div></div>
    <div class="health-row"><div class="health-meta text-body-sm u-muted-soft">Overall Rating</div><div class="cell-strong">${perf.rating.toFixed(1)} / 5.0</div></div>
    <div class="health-row"><div class="health-meta text-body-sm u-muted-soft">Safety Score</div>
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="meter" style="width:64px;"><div class="meter-fill ${healthMeterClass(driver.safety_score)}" style="width:${driver.safety_score}%"></div></div>
        <span class="text-body-sm">${driver.safety_score}</span>
      </div>
    </div>
  `;

  const documents = DB.driverDocuments[driver.id] || [];
  document.getElementById("documents-body").innerHTML = documents.length ? documents.map(d => `
    <tr>
      <td class="cell-strong">${d.document_type}</td>
      <td class="cell-muted">${DB.fmtDate(d.expiry_date)}</td>
      <td><a href="#" class="btn-text text-body-sm">View File</a></td>
    </tr>
  `).join("") : `<tr><td colspan="3" class="cell-muted" style="text-align:center; padding: var(--space-md);">No documents on file.</td></tr>`;

  const trips = DB.trips.filter(t => t.driver_id === driver.id);
  document.getElementById("trips-body").innerHTML = trips.length ? trips.map(t => {
    const vehicle = DB.getVehicle(t.vehicle_id);
    return `
      <tr>
        <td class="cell-strong">${t.source_location} → ${t.destination_location}</td>
        <td>${vehicle.registration_number}</td>
        <td>${DB.fmtMoney(t.revenue)}</td>
        <td>${StatusBadge.trip(t.status)}</td>
        <td class="cell-muted">${DB.fmtDateTime(t.dispatched_at)}</td>
      </tr>
    `;
  }).join("") : `<tr><td colspan="5" class="cell-muted" style="text-align:center; padding: var(--space-md);">No trips recorded for this driver.</td></tr>`;
</script>

</body>
</html>
