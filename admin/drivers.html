<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Drivers — TransitOps Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/design-system.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-mark">T</div>
      <div>
        <div class="sidebar-brand-name">TransitOps</div>
        <div class="sidebar-brand-sub">Super Admin</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-group">
        <div class="sidebar-group-label">Overview</div>
        <a href="index.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
      </div>
      <div class="sidebar-group">
        <div class="sidebar-group-label">Fleet</div>
        <a href="vehicles.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 24 24"><rect x="1" y="5" width="15" height="11"/><path d="M16 9h4l3 3v4h-7V9z"/><circle cx="5.5" cy="18" r="2"/><circle cx="18.5" cy="18" r="2"/></svg>
          Vehicles
        </a>
        <a href="drivers.html" class="sidebar-link is-active">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Drivers
        </a>
      </div>
      <div class="sidebar-group">
        <div class="sidebar-group-label">Operations</div>
        <a href="trips.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8 19h7a4 4 0 0 0 4-4v-1a4 4 0 0 0-4-4H9a4 4 0 0 1-4-4v-1"/></svg>
          Trips &amp; Dispatch
        </a>
        <a href="analytics.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>
          Fleet Map &amp; Analytics
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">GR</div>
        <div>
          <div class="sidebar-user-name">Gaurav Rathva</div>
          <div class="sidebar-user-role">Super Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap: var(--space-xs);">
        <button class="nav-toggle" data-nav-toggle aria-label="Toggle navigation">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title-group">
          <div class="text-caption-uppercase topbar-eyebrow">Fleet</div>
          <h1 class="text-display-md topbar-title">Drivers</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="search-field topbar-search">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          <input class="input" type="text" placeholder="Search vehicles, drivers, trips…" />
        </div>
        <button class="icon-btn" aria-label="Notifications">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="dot"></span>
        </button>
      </div>
    </header>

    <main class="content">

      <div class="kpi-grid" id="kpi-grid"></div>

      <div class="table-toolbar">
        <div class="table-filters">
          <select class="select" id="filter-status">
            <option value="">All Statuses</option>
            <option value="available">Available</option>
            <option value="on_trip">On Trip</option>
            <option value="suspended">Suspended</option>
          </select>
          <div class="search-field">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            <input class="input" id="filter-search" type="text" placeholder="Search name or license number…" />
          </div>
        </div>
        <button class="btn btn-primary" data-modal-open="modal-add-driver">
          <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M12 5v14M5 12h14"/></svg>
          Add Driver
        </button>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Driver</th>
              <th>License No.</th>
              <th>Category</th>
              <th>License Expiry</th>
              <th>Safety Score</th>
              <th>Rating</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="drivers-body"></tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<!-- Add Driver Modal -->
<div class="modal-overlay" id="modal-add-driver">
  <div class="modal">
    <div class="modal-header">
      <h2 class="text-title-md" style="margin:0;">Add Driver</h2>
      <button class="btn-text" data-modal-close>✕</button>
    </div>
    <div class="modal-body">
      <form class="form-grid">
        <div class="field span-2">
          <label class="label">Full Name</label>
          <input class="input" placeholder="Raj Mehta" />
        </div>
        <div class="field">
          <label class="label">License Number</label>
          <input class="input" placeholder="GJ0120220041233" />
        </div>
        <div class="field">
          <label class="label">License Category</label>
          <select class="select">
            <option>HMV</option>
            <option>LMV</option>
            <option>LMV+HMV</option>
          </select>
        </div>
        <div class="field">
          <label class="label">License Expiry Date</label>
          <input class="input" type="date" />
        </div>
        <div class="field">
          <label class="label">Phone</label>
          <input class="input" placeholder="+91 98250 11223" />
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline-muted" data-modal-close>Cancel</button>
      <button class="btn btn-primary" data-modal-close>Save Driver</button>
    </div>
  </div>
</div>

<script src="assets/mock-data.js"></script>
<script src="assets/app.js"></script>
<script>
  let activeFilters = { status: "", search: "" };

  function renderKPIs(){
    const drivers = DB.drivers;
    const cells = [
      { label: "Total Drivers", value: drivers.length },
      { label: "Available", value: drivers.filter(d => d.status === "available").length },
      { label: "On Trip", value: drivers.filter(d => d.status === "on_trip").length },
      { label: "Avg Safety Score", value: Math.round(drivers.reduce((s,d)=>s+d.safety_score,0)/drivers.length) },
    ];
    document.getElementById("kpi-grid").innerHTML = cells.map(c => `
      <div class="kpi-cell">
        <div class="kpi-label text-caption-uppercase"><span>${c.label}</span></div>
        <div class="kpi-value text-number-display">${c.value}</div>
      </div>
    `).join("");
  }

  function renderDrivers(){
    let rows = DB.drivers.filter(d => {
      if(activeFilters.status && d.status !== activeFilters.status) return false;
      if(activeFilters.search){
        const q = activeFilters.search.toLowerCase();
        if(!d.name.toLowerCase().includes(q) && !d.license_number.toLowerCase().includes(q)) return false;
      }
      return true;
    });

    document.getElementById("drivers-body").innerHTML = rows.map(d => {
      const perf = DB.driverPerformance[d.id];
      const expSoon = new Date(d.license_expiry_date) - Date.now() < 1000*60*60*24*30;
      return `
        <tr>
          <td>
            <div class="row-link">
              <div class="row-avatar">${initials(d.name)}</div>
              <a class="cell-strong" href="driver-detail.html?id=${d.id}">${d.name}</a>
            </div>
          </td>
          <td class="cell-muted">${d.license_number}</td>
          <td class="cell-muted">${d.license_category}</td>
          <td class="${expSoon ? 'u-warning' : 'cell-muted'}">${DB.fmtDate(d.license_expiry_date)}</td>
          <td>
            <div style="display:flex; align-items:center; gap:8px;">
              <div class="meter" style="width:64px;"><div class="meter-fill ${healthMeterClass(d.safety_score)}" style="width:${d.safety_score}%"></div></div>
              <span class="text-body-sm">${d.safety_score}</span>
            </div>
          </td>
          <td class="cell-muted">${perf.rating.toFixed(1)} ★</td>
          <td>${StatusBadge.driver(d.status)}</td>
          <td><a href="driver-detail.html?id=${d.id}" class="btn btn-sm btn-outline-muted">View</a></td>
        </tr>
      `;
    }).join("") || `<tr><td colspan="8" class="cell-muted" style="text-align:center; padding: var(--space-md);">No drivers match these filters.</td></tr>`;
  }

  document.getElementById("filter-status").addEventListener("change", (e) => { activeFilters.status = e.target.value; renderDrivers(); });
  document.getElementById("filter-search").addEventListener("input", (e) => { activeFilters.search = e.target.value; renderDrivers(); });

  renderKPIs();
  renderDrivers();
</script>

</body>
</html>
