<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vehicles — TransitOps Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/design-system.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-mark">T</div>
      <div>
        <div class="sidebar-brand-name">TransitOps</div>
        <div class="sidebar-brand-sub">Super Admin</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-group">
        <div class="sidebar-group-label">Overview</div>
        <a href="index.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
      </div>
      <div class="sidebar-group">
        <div class="sidebar-group-label">Fleet</div>
        <a href="vehicles.html" class="sidebar-link is-active">
          <svg class="icon" viewBox="0 0 24 24"><rect x="1" y="5" width="15" height="11"/><path d="M16 9h4l3 3v4h-7V9z"/><circle cx="5.5" cy="18" r="2"/><circle cx="18.5" cy="18" r="2"/></svg>
          Vehicles
        </a>
        <a href="drivers.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Drivers
        </a>
      </div>
      <div class="sidebar-group">
        <div class="sidebar-group-label">Operations</div>
        <a href="trips.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8 19h7a4 4 0 0 0 4-4v-1a4 4 0 0 0-4-4H9a4 4 0 0 1-4-4v-1"/></svg>
          Trips &amp; Dispatch
        </a>
        <a href="analytics.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>
          Fleet Map &amp; Analytics
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">GR</div>
        <div>
          <div class="sidebar-user-name">Gaurav Rathva</div>
          <div class="sidebar-user-role">Super Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap: var(--space-xs);">
        <button class="nav-toggle" data-nav-toggle aria-label="Toggle navigation">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title-group">
          <div class="text-caption-uppercase topbar-eyebrow">Fleet</div>
          <h1 class="text-display-md topbar-title">Vehicles</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="search-field topbar-search">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          <input class="input" type="text" placeholder="Search vehicles, drivers, trips…" />
        </div>
        <button class="icon-btn" aria-label="Notifications">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="dot"></span>
        </button>
      </div>
    </header>

    <main class="content">

      <div class="kpi-grid" id="kpi-grid"></div>

      <div class="table-toolbar">
        <div class="table-filters">
          <select class="select" id="filter-status">
            <option value="">All Statuses</option>
            <option value="active">Active</option>
            <option value="idle">Idle</option>
            <option value="maintenance">Maintenance</option>
            <option value="retired">Retired</option>
          </select>
          <select class="select" id="filter-region">
            <option value="">All Regions</option>
          </select>
          <div class="search-field">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            <input class="input" id="filter-search" type="text" placeholder="Search registration or model…" />
          </div>
        </div>
        <button class="btn btn-primary" data-modal-open="modal-add-vehicle">
          <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M12 5v14M5 12h14"/></svg>
          Add Vehicle
        </button>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Registration</th>
              <th>Model</th>
              <th>Type</th>
              <th>Region</th>
              <th>Odometer</th>
              <th>Health</th>
              <th>Utilization</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="vehicles-body"></tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<!-- Add Vehicle Modal -->
<div class="modal-overlay" id="modal-add-vehicle">
  <div class="modal">
    <div class="modal-header">
      <h2 class="text-title-md" style="margin:0;">Add Vehicle</h2>
      <button class="btn-text" data-modal-close>✕</button>
    </div>
    <div class="modal-body">
      <form class="form-grid">
        <div class="field">
          <label class="label">Registration Number</label>
          <input class="input" placeholder="GJ-01-AB-1234" />
        </div>
        <div class="field">
          <label class="label">Model</label>
          <input class="input" placeholder="Tata Prima 4928" />
        </div>
        <div class="field">
          <label class="label">Vehicle Type</label>
          <select class="select">
            <option>Heavy Truck</option>
            <option>Medium Truck</option>
            <option>Mini Truck</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Max Load Capacity (t)</label>
          <input class="input" type="number" placeholder="18.5" />
        </div>
        <div class="field">
          <label class="label">Region</label>
          <input class="input" placeholder="Ahmedabad" />
        </div>
        <div class="field">
          <label class="label">Acquisition Cost (₹)</label>
          <input class="input" type="number" placeholder="4200000" />
        </div>
        <div class="field span-2">
          <label class="label">Status</label>
          <select class="select">
            <option value="active">Active</option>
            <option value="idle">Idle</option>
            <option value="maintenance">Maintenance</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline-muted" data-modal-close>Cancel</button>
      <button class="btn btn-primary" data-modal-close>Save Vehicle</button>
    </div>
  </div>
</div>

<script src="assets/mock-data.js"></script>
<script src="assets/app.js"></script>
<script>
  let activeFilters = { status: "", region: "", search: "" };

  function populateRegionFilter(){
    const regions = [...new Set(DB.vehicles.map(v => v.region))].sort();
    const sel = document.getElementById("filter-region");
    sel.innerHTML = `<option value="">All Regions</option>` + regions.map(r => `<option value="${r}">${r}</option>`).join("");
  }

  function renderKPIs(){
    const vehicles = DB.vehicles;
    const cells = [
      { label: "Total Vehicles", value: vehicles.length },
      { label: "Active", value: vehicles.filter(v => v.status === "active").length },
      { label: "In Maintenance", value: vehicles.filter(v => v.status === "maintenance").length },
      { label: "Avg Health Score", value: Math.round(Object.values(DB.vehicleHealth).reduce((s,h)=>s+h.health_score,0)/Object.keys(DB.vehicleHealth).length) },
    ];
    document.getElementById("kpi-grid").innerHTML = cells.map(c => `
      <div class="kpi-cell">
        <div class="kpi-label text-caption-uppercase"><span>${c.label}</span></div>
        <div class="kpi-value text-number-display">${c.value}</div>
      </div>
    `).join("");
  }

  function renderVehicles(){
    let rows = DB.vehicles.filter(v => {
      if(activeFilters.status && v.status !== activeFilters.status) return false;
      if(activeFilters.region && v.region !== activeFilters.region) return false;
      if(activeFilters.search){
        const q = activeFilters.search.toLowerCase();
        if(!v.registration_number.toLowerCase().includes(q) && !v.model.toLowerCase().includes(q)) return false;
      }
      return true;
    });

    document.getElementById("vehicles-body").innerHTML = rows.map(v => {
      const health = DB.vehicleHealth[v.id];
      const analytics = DB.vehicleAnalytics[v.id];
      return `
        <tr>
          <td><a class="cell-strong" href="vehicle-detail.html?id=${v.id}">${v.registration_number}</a></td>
          <td>${v.model}</td>
          <td class="cell-muted">${v.vehicle_type}</td>
          <td class="cell-muted">${v.region}</td>
          <td class="cell-muted">${v.odometer.toLocaleString("en-IN")} km</td>
          <td>
            <div style="display:flex; align-items:center; gap:8px;">
              <div class="meter" style="width:64px;"><div class="meter-fill ${healthMeterClass(health.health_score)}" style="width:${health.health_score}%"></div></div>
              <span class="text-body-sm">${health.health_score}</span>
            </div>
          </td>
          <td class="cell-muted">${analytics.utilization_percent}%</td>
          <td>${StatusBadge.vehicle(v.status)}</td>
          <td><a href="vehicle-detail.html?id=${v.id}" class="btn btn-sm btn-outline-muted">View</a></td>
        </tr>
      `;
    }).join("") || `<tr><td colspan="9" class="cell-muted" style="text-align:center; padding: var(--space-md);">No vehicles match these filters.</td></tr>`;
  }

  document.getElementById("filter-status").addEventListener("change", (e) => { activeFilters.status = e.target.value; renderVehicles(); });
  document.getElementById("filter-region").addEventListener("change", (e) => { activeFilters.region = e.target.value; renderVehicles(); });
  document.getElementById("filter-search").addEventListener("input", (e) => { activeFilters.search = e.target.value; renderVehicles(); });

  populateRegionFilter();
  renderKPIs();
  renderVehicles();
</script>

</body>
</html>
