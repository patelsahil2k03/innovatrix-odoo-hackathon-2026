[project]
name = "transitops"
version = "0.1.0"
description = "TransitOps API — smart transport operations platform (Odoo Hackathon 2026, Team Innovatrix)"
requires-python = ">=3.13"
dependencies = [
    "fastapi~=0.139",
    "uvicorn[standard]>=0.30",
    "sqlalchemy~=2.0.51",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sse-starlette>=2.1",
    "passlib[bcrypt]>=1.7",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transitops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
